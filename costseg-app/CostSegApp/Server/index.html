<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cost Seg Professional</title>
  <style>
    :root {
      --bg: #f5f2ea;          /* warm paper */
      --paper: #fffdf8;
      --ink: #1d2633;
      --ink2: #46505e;
      --muted: #7a7466;
      --line: #e3ddcf;
      --line2: #d3ccbb;
      --navy: #17263d;
      --navy2: #22375a;
      --accent: #2f5d8a;
      --gold: #b08d57;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --side: #17263d; --solid: #17263d;
      --tint: #f1ece0; --tint2: #f7f3ea; --tint3: #efe9dc; --chipmix: #555;
      --good: #2f6b3f; --link: #4f46e5; --warn-bg: #fef3c7; --warn: #92400e;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0e141c;
      --paper: #161e29;
      --ink: #e4e8ee;
      --ink2: #b3bcc8;
      --muted: #8a94a2;
      --line: #253041;
      --line2: #344257;
      --navy: #e9edf3;          /* headings and key numbers */
      --accent: #6fa3d8;
      --side: #0a0f16; --solid: #2f5f93;
      --tint: #1d2735; --tint2: #1a2330; --tint3: #202b3a; --chipmix: #fff;
      --good: #74d39a; --link: #a9b4ff; --warn-bg: #3a2e12; --warn: #f3c96b;
      color-scheme: dark;
    }
    :root[data-theme="dark"] .section { box-shadow: none; }
    :root[data-theme="dark"] .topbar { border-bottom: 1px solid #1c2633; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink);
      font-variant-numeric: tabular-nums;
      min-height: 100vh;
    }

    /* Top bar: brand, then the study steps as tabs */
    .topbar { background: var(--side); color: #e8e3d6; }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 32px 12px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--gold); color: var(--gold);
      display: grid; place-items: center; font-family: var(--serif); font-size: 14px; font-weight: 700;
    }
    .brand-name { font-family: var(--serif); font-size: 18px; line-height: 1.15; color: #fff; }
    .brand-name small { display: block; font-family: var(--sans); font-size: 10px; color: #9fb0c6; letter-spacing: .6px; }
    nav#tabs { display: flex; gap: 0; padding: 0 22px; overflow-x: auto; border-top: 1px solid #ffffff14; scrollbar-width: thin; }
    nav#tabs button {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 10px 10px; cursor: pointer;
      font: inherit; font-size: 13.5px; color: #c9d2de; white-space: nowrap;
    }
    nav#tabs button:hover { background: #ffffff0d; color: #fff; }
    nav#tabs button.active { color: #fff; border-bottom-color: var(--gold); background: #ffffff12; }
    nav#tabs .num {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
      font-size: 10.5px; font-weight: 700; border: 1px solid #ffffff33; color: #aab6c6;
    }
    nav#tabs .st { display: none; }
    @media (max-width: 1380px) {
      nav#tabs { padding: 0 12px; }
      nav#tabs button { padding: 12px 7px 10px; font-size: 13px; gap: 6px; }
    }
    .theme-btn {
      font: inherit; font-size: 12px; color: #c9d2de; cursor: pointer; white-space: nowrap;
      background: #ffffff10; border: 1px solid #ffffff22; border-radius: 7px; padding: 6px 11px;
    }
    .theme-btn:hover { background: #ffffff1c; color: #fff; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .user-name { font-size: 13px; color: #c9d2de; margin-right: 6px; }

    /* Study summary bar: one slim line */
    .content { min-width: 0; }
    .studybar {
      position: sticky; top: 0; z-index: 25; background: var(--paper); border-bottom: 1px solid var(--line);
      display: flex; align-items: baseline; gap: 18px; padding: 7px max(32px, calc((100% - 1240px) / 2 + 32px));
      font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden;
    }
    .studybar .who { margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .studybar .who b { font-family: var(--serif); font-size: 14px; color: var(--navy); margin-right: 8px; }
    .stat b { color: var(--navy); font-size: 13px; margin-left: 4px; }
    .stat b.good { color: var(--good); }

    main { padding: 30px 32px 60px; max-width: 1240px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel h2 { margin: 0 0 6px; font-family: var(--serif); font-size: 28px; font-weight: 600; color: var(--navy); letter-spacing: -.2px; }
    .panel > p { margin: 0; color: var(--muted); max-width: 760px; }
    .card {
      margin-top: 22px; background: var(--paper); border: 1px dashed var(--line2);
      border-radius: 10px; padding: 46px; text-align: center; color: var(--muted);
    }
    .card b { display: block; font-family: var(--serif); font-size: 18px; color: var(--navy); margin-bottom: 6px; font-weight: 600; }
    @media (max-width: 900px) {
      .top-row { padding: 12px 16px 10px; }
      nav#tabs { padding: 0 8px; }
      .studybar { padding: 10px 16px; gap: 14px; }
      main { padding: 20px 16px; }
    }

    /* Forms */
    .section {
      margin-top: 22px; background: var(--paper); border: 1px solid var(--line);
      border-radius: 10px; padding: 22px 24px; box-shadow: 0 1px 2px #3a2f1a0a;
    }
    .section h3 { margin: 0 0 16px; font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--navy); }
    .section .hint { margin: -8px 0 14px; font-size: 12px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
    .grid.four { grid-template-columns: repeat(4, 1fr); }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field.two { grid-column: span 2; }
    .field label { font-size: 12px; font-weight: 600; color: var(--ink2); }
    .field input, .field select, .field textarea {
      font: inherit; font-size: 14px; color: var(--ink); width: 100%;
      border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; background: var(--paper);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent)22;
    }
    .field .auto { border-left-width: 5px; }
    .field label.check, label.check {
      display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink);
      font-size: 14px; margin-top: 4px; cursor: pointer;
    }
    label.check input { width: 16px; height: 16px; margin: 0; flex-shrink: 0; }
    .hidden { display: none !important; }
    @media (max-width: 800px) { .grid, .grid.four { grid-template-columns: 1fr; } .field.two { grid-column: auto; } }

    .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .seg button { border: 0; background: var(--paper); font: inherit; font-size: 13px; padding: 0 10px; cursor: pointer; color: var(--ink2); }
    .seg button.on { background: var(--solid); color: #fff; }
    .with-seg { display: flex; gap: 6px; }
    .with-seg input { flex: 1; min-width: 0; }

    /* Workpapers */
    .dropzone {
      display: block; margin-top: 20px; border: 2px dashed var(--line2); border-radius: 10px;
      background: var(--paper); padding: 30px; text-align: center; color: var(--ink2); cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .dropzone:hover, .dropzone.over { background: var(--tint); border-color: var(--accent); }
    .dropzone b { color: var(--navy); }
    .dropzone small { display: block; margin-top: 6px; color: var(--muted); }

    .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .doc-pill {
      display: inline-flex; align-items: center;
      border: 1px solid var(--line2); background: var(--paper); border-radius: 999px; overflow: hidden;
    }
    .doc-pill.active { background: var(--solid); border-color: var(--solid); }
    .doc-pill button { border: 0; background: none; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
    .doc-pill.active button { color: #fff; }
    .doc-pill .open { padding: 6px 4px 6px 12px; }
    .doc-pill .open span { opacity: .7; margin-left: 6px; }
    .doc-pill .del { padding: 6px 11px 6px 7px; font-size: 16px; line-height: 1; opacity: .55; }
    .doc-pill .del:hover { opacity: 1; color: #dc2626; }

    .palette {
      position: sticky; top: 38px; z-index: 20;
      margin-top: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 14px; box-shadow: 0 4px 14px var(--navy)10;
    }
    .palette .tip { font-size: 12px; color: var(--muted); margin-bottom: 9px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      --c: #888;
      border: 1.5px solid color-mix(in srgb, var(--c) 45%, var(--paper));
      background: color-mix(in srgb, var(--c) 14%, var(--paper));
      color: color-mix(in srgb, var(--c) 70%, var(--chipmix));
      border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; opacity: .8;
      transition: all .12s;
    }
    .chip:hover { opacity: 1; }
    .chip.active {
      background: var(--c); color: #fff; border-color: var(--c); opacity: 1;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, var(--paper));
    }
    .chip .count {
      background: var(--paper); color: var(--c); border-radius: 999px; font-size: 11px;
      padding: 1px 6px; border: 1px solid var(--c);
    }
    .chip:not(.found) .count { display: none; }

    .pages { margin-top: 16px; }
    .page-row { display: flex; gap: 16px; margin-bottom: 22px; align-items: flex-start; }
    .page-side {
      width: 230px; flex-shrink: 0; background: var(--paper); border: 1px solid var(--line);
      border-radius: 8px; padding: 12px; position: sticky; top: 152px; font-size: 13px;
    }
    .page-side h4 { margin: 0 0 8px; font-size: 13px; color: var(--navy); }
    .page-side .none { color: #a39e90; font-size: 12px; }
    .finding {
      border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 12%, var(--paper));
      border-radius: 4px; padding: 6px 26px 6px 8px; margin-bottom: 6px; position: relative;
    }
    .finding .name { color: var(--c); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
    .finding .val { color: var(--ink); word-break: break-word; }
    .finding .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .finding button {
      position: absolute; top: 4px; right: 4px; border: 0; background: none;
      color: #a39e90; cursor: pointer; font-size: 15px; line-height: 1;
    }
    .finding button:hover { color: #dc2626; }

    .page-wrap { position: relative; background: #fff; box-shadow: 0 1px 6px #0002; flex-shrink: 0; }
    .page-wrap canvas { display: block; }
    .page-layer { position: absolute; inset: 0; }
    .page-layer.drawing { cursor: crosshair; }
    .page-num { position: absolute; top: -18px; left: 0; font-size: 11px; color: var(--muted); }
    .hl {
      position: absolute; border: 2px solid var(--c);
      background: color-mix(in srgb, var(--c) 30%, transparent);
      mix-blend-mode: multiply; border-radius: 2px;
    }
    .hl.draft { border-style: dashed; }

    .popup {
      position: absolute; z-index: 30; width: 300px; background: var(--paper);
      border: 2px solid var(--c); border-radius: 8px; padding: 12px;
      box-shadow: 0 8px 24px #0003; cursor: default;
    }
    .popup .title { font-size: 12px; font-weight: 700; color: var(--c); margin-bottom: 8px; }
    .popup .row { margin-bottom: 9px; }
    .popup .row > label { display: block; font-size: 11px; font-weight: 600; color: var(--ink2); margin-bottom: 4px; }
    .popup input:not([type=checkbox]), .popup textarea, .popup select {
      width: 100%; font: inherit; font-size: 14px; border: 1px solid var(--line2);
      border-radius: 6px; padding: 7px 9px; background: var(--paper);
    }
    .popup textarea { min-height: 60px; resize: vertical; }
    .popup .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
    .popup .btns button { font: inherit; font-size: 13px; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line2); background: var(--paper); }
    .popup .btns button.save { background: var(--c); color: #fff; border-color: var(--c); }
    .popup .err { color: #dc2626; font-size: 12px; margin-top: 4px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--solid); color: #fff; padding: 10px 16px; border-radius: 8px;
      font-size: 14px; z-index: 100; box-shadow: 0 6px 20px #0003;
    }

    /* Bases */
    .bases-top { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px; flex-wrap: wrap; }
    .bases-top .total { font-size: 14px; color: var(--ink2); }
    .bases-top .total b { color: var(--navy); font-size: 16px; }
    .btn { font: inherit; font-size: 14px; border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line2); background: var(--paper); color: var(--ink); }
    .btn.primary { background: var(--solid); border-color: var(--solid); color: #fff; }
    .btn.danger { color: #dc2626; }
    .basis-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
    .basis-card .head .tag { font-size: 11px; color: var(--muted); }
    .basis-card .head .tag b { color: var(--link); }
    .bonus { display: flex; gap: 10px; align-items: flex-start; background: var(--tint2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 16px; }
    .bonus .pct { font-size: 26px; font-weight: 700; color: var(--navy); min-width: 70px; }
    .bonus .why { font-size: 13px; color: var(--ink2); flex: 1; }
    .bonus .why b { color: var(--ink); }
    .bonus .ovr { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
    .bonus .ovr input { width: 70px; font: inherit; font-size: 13px; border: 1px solid var(--line2); border-radius: 6px; padding: 5px 7px; background: var(--paper); color: var(--ink); }
    .summary { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--ink2); }
    .summary b { display: block; font-size: 16px; color: var(--navy); }
    .fromwp { border-left: 5px solid #b9b19e !important; }

    /* Takeoffs */
    .search-wrap { position: relative; }
    .results {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 40; margin-top: 4px;
      background: var(--paper); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 8px 24px #0002;
      max-height: 340px; overflow-y: auto;
    }
    .result { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--tint3); }
    .result:last-child { border-bottom: 0; }
    .result.hi, .result:hover { background: var(--tint); }
    .result .rn { font-weight: 600; font-size: 14px; }
    .result .rm { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .result .none { color: #a39e90; }
    .csi { color: #a39e90; font-weight: 400; font-size: 12px; }
    .picked {
      margin-top: 10px; border: 1px solid var(--line); background: var(--tint2); border-radius: 8px; padding: 10px 12px;
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
    }
    .picked .pn { font-weight: 700; color: var(--navy); }
    .picked .pd { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .picked button { border: 0; background: none; color: #a39e90; cursor: pointer; font-size: 18px; line-height: 1; }
    .lifeseg { display: inline-flex; gap: 6px; }
    .lifeseg button {
      font: inherit; font-size: 14px; font-weight: 600; min-width: 54px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
      border: 1.5px solid var(--line2); background: var(--paper); color: var(--ink2);
    }
    .lifeseg button.on { background: var(--solid); border-color: var(--solid); color: #fff; }
    .srcseg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
    .srcseg button { border: 0; background: var(--paper); font: inherit; font-size: 14px; padding: 8px 16px; cursor: pointer; color: var(--ink2); }
    .srcseg button.on { background: var(--solid); color: #fff; }
    .add-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 12px; flex-wrap: wrap; }
    .add-row .preview { font-size: 14px; color: var(--ink2); }
    .add-row .preview b { font-size: 18px; color: var(--navy); }
    .tallies { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    .tallies .section { margin-top: 20px; }
    @media (max-width: 900px) { .tallies { grid-template-columns: 1fr; } }
    table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    table.t td { padding: 7px 8px; border-bottom: 1px solid var(--tint3); vertical-align: top; }
    table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
    table.t tr.total td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; }
    table.t select { font: inherit; font-size: 13px; border: 1px solid var(--line2); border-radius: 5px; padding: 3px 5px; background: var(--paper); }
    table.t .x { border: 0; background: none; color: #a39e90; cursor: pointer; font-size: 16px; }
    table.t .x:hover { color: #dc2626; }
    .src-tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--tint); color: var(--ink2); white-space: nowrap; }
    .src-tag.actual { background: var(--warn-bg); color: var(--warn); }
    .group-row td { background: var(--tint2); font-weight: 700; color: var(--navy); }

    /* Exterior */
    .ex-wrap { display: grid; grid-template-columns: 290px 1fr; gap: 16px; margin-top: 16px; align-items: start; }
    .ex-panel { position: sticky; top: 46px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; max-height: calc(100vh - 60px); overflow-y: auto; }
    .ex-panel h4 { margin: 14px 0 8px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .ex-panel h4:first-child { margin-top: 0; }
    .tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .tool {
      border: 1px solid var(--line2); background: var(--paper); color: var(--ink2); border-radius: 7px; cursor: pointer;
      font: inherit; font-size: 11px; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .tool .ic { font-size: 16px; line-height: 1; }
    .tool kbd { font-size: 9px; opacity: .6; font-family: inherit; }
    .tool.on { background: var(--solid); border-color: var(--solid); color: #fff; }
    .tool:disabled { opacity: .35; cursor: not-allowed; }
    .ex-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; cursor: pointer;
      border: 1px solid transparent; margin-bottom: 3px;
    }
    .ex-item:hover { background: var(--tint2); }
    .ex-item.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--paper)); }
    .ex-item .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--c); flex-shrink: 0; }
    .ex-item .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; }
    .ex-item .nm small { display: block; color: var(--muted); font-size: 11px; }
    .ex-item .key { font-size: 10px; color: var(--muted); border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; }
    .ex-empty { font-size: 12px; color: var(--muted); padding: 4px 2px 8px; }
    .ex-add { margin-top: 6px; }
    .ex-add input, .ex-add select { width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: var(--paper); border: 1px solid var(--line2); border-radius: 6px; padding: 7px 9px; }
    .ex-add .results { position: static; margin-top: 4px; max-height: 260px; box-shadow: none; }
    .ex-add .result { padding: 6px 9px; }
    .ex-add .result .rn { font-size: 13px; }
    .ex-add .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 4px 0; }
    .ex-viewer { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .ex-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .ex-bar .sep { width: 1px; height: 20px; background: var(--line); }
    .ex-bar button.small { font: inherit; font-size: 12px; border: 1px solid var(--line2); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
    .ex-bar .scale-ok { color: var(--good); font-weight: 600; }
    .ex-bar .scale-no { color: #e5484d; font-weight: 600; }
    .ex-hint { margin-left: auto; color: var(--muted); font-size: 12px; }
    .ex-stage { position: relative; overflow: auto; max-height: calc(100vh - 150px); background: #6b7280; }
    .ex-page { position: relative; margin: 0 auto; background: #fff; }
    .ex-page canvas { display: block; }
    .ex-page svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ex-page svg.drawing { cursor: crosshair; }
    .ex-pop {
      position: absolute; z-index: 30; width: 270px; background: var(--paper); color: var(--ink); border: 2px solid var(--solid);
      border-radius: 9px; padding: 12px; box-shadow: 0 10px 30px #0006; font-size: 13px;
    }
    .ex-pop .t { font-weight: 700; margin-bottom: 8px; }
    .ex-pop .presets { display: flex; gap: 6px; margin-bottom: 8px; }
    .ex-pop .presets button, .ex-pop .btns button { font: inherit; font-size: 13px; border: 1px solid var(--line2); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    .ex-pop .presets button { flex: 1; font-weight: 600; }
    .ex-pop input { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; }
    .ex-pop .or { font-size: 11px; color: var(--muted); margin: 6px 0 4px; }
    .ex-pop .inl { display: flex; align-items: center; gap: 6px; }
    .ex-pop .inl input { width: 80px; }
    .ex-pop label.check { font-size: 12px; margin-top: 8px; }
    .ex-pop .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
    .ex-pop .btns .save { background: var(--solid); border-color: var(--solid); color: #fff; }
    table.t tr.meas td { font-size: 12px; color: var(--muted); padding-top: 3px; padding-bottom: 3px; }
    table.t tr.meas td:first-child { padding-left: 30px; }
    table.t select.mini { font-size: 12px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: 0; }
    @media (max-width: 980px) { .ex-wrap { grid-template-columns: 1fr; } .ex-panel { position: static; max-height: none; } }
    table.tree td { border-bottom: 1px solid var(--tint3); }
    table.tree tr.lvl-basis td { background: var(--solid); color: #fff; font-weight: 700; font-size: 14px; padding: 9px 10px; }
    table.tree tr.lvl-basis td .muted { color: #b9c7d8; font-weight: 400; font-size: 12px; }
    table.tree tr.lvl-life td { background: var(--tint); font-weight: 700; color: var(--navy); }
    table.tree tr.lvl-life td:first-child { padding-left: 24px; }
    table.tree tr.lvl-cat td:first-child { padding-left: 44px; color: var(--ink2); }
    table.tree tr.lvl-cat td { color: var(--ink2); }
    table.tree tr.grand td { font-weight: 700; font-size: 14px; border-top: 2px solid var(--navy); border-bottom: 0; padding-top: 10px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-row">
      <div class="brand">
        <div class="brand-mark">CS</div>
        <div class="brand-name">Cost Seg Professional<small>COST SEGREGATION STUDIES</small></div>
      </div>
      <div class="top-actions">
        <span class="user-name hidden" id="userName"></span>
        <button class="theme-btn" id="themeBtn"></button>
        <button class="theme-btn hidden" id="signOut">Sign out</button>
      </div>
    </div>
    <nav id="tabs"></nav>
  </header>

  <div class="content">
    <div class="studybar" id="studyBar"></div>
    <main id="panels"></main>
  </div>

  <!-- ===================== WORKPAPERS ===================== -->
  <template id="workpapers-panel">
    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
      <b>Drag and drop PDFs here</b> or click to browse
      <small>Closing statements, appraisals, tax records, and other audit support</small>
    </label>

    <div class="docs" id="docList"></div>

    <div class="palette hidden" id="palette">
      <div class="tip">Click an item, then drag a box over where it appears on the page. Press Esc to cancel.</div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="pages" id="pages"></div>
  </template>

  <!-- ===================== OVERVIEW ===================== -->
  <template id="overview-form">
    <div class="section">
      <h3>Study</h3>
      <div class="grid">
        <div class="field"><label for="studyNumber">Study number</label><input id="studyNumber"></div>
        <div class="field"><label for="taxpayerEntity">Taxpayer entity</label><input id="taxpayerEntity"></div>
        <div class="field"><label for="letterAddressee">Letter addressee</label><input id="letterAddressee"></div>
      </div>
    </div>

    <div class="section">
      <h3>Property</h3>
      <div class="grid">
        <div class="field wide"><label for="address">Address</label><input id="address"></div>

        <div class="field">
          <label for="propertyType">Property type</label>
          <select id="propertyType">
            <option value="">Select…</option>
            <option>Residential</option>
            <option>Multifamily</option>
            <option>Industrial</option>
            <option>Office</option>
            <option>Retail</option>
            <option>Restaurant</option>
            <option>Special Purpose</option>
            <option>Hospitality</option>
            <option value="Custom">Custom</option>
          </select>
          <input id="customPropertyType" class="hidden" placeholder="Enter property type">
          <label id="strRow" class="check hidden"><input type="checkbox" id="shortTermRental"> Short-term rental?</label>
        </div>

        <div class="field">
          <label for="assetClass">Asset class</label>
          <select id="assetClass"><option value="">Select a property type first</option></select>
          <input id="customAssetClass" class="hidden" placeholder="Enter asset class">
        </div>

        <div class="field"><label for="buildingLife">Building life (years)</label><input id="buildingLife" inputmode="decimal"></div>
        <div class="field"><label for="totalSqft">Total sq ft</label><input id="totalSqft" class="money" inputmode="numeric"></div>
        <div class="field"><label for="lotSize">Lot size</label><input id="lotSize"></div>
        <div class="field"><label for="stories">Stories</label><input id="stories" inputmode="numeric"></div>
        <div class="field"><label for="yearBuilt">Year built</label><input id="yearBuilt" inputmode="numeric"></div>

        <div class="field wide"><label for="propertyDescription">Property description</label><textarea id="propertyDescription"></textarea></div>
        <div class="field wide"><label for="improvementDetails">Improvement details</label><textarea id="improvementDetails"></textarea></div>
      </div>
    </div>

    <div class="section">
      <h3>From workpapers</h3>
      <div class="hint">Fills in automatically when you highlight these on the Workpapers tab (purchase values). Improvements show on the Bases tab.</div>
      <div class="grid">
        <div class="field"><label for="parcelNumber">Parcel number</label><input id="parcelNumber"></div>
        <div class="field"><label for="purchasePrice">Purchase price</label><input id="purchasePrice"></div>
        <div class="field"><label for="landValue">Land value</label><input id="landValue"></div>
        <div class="field"><label for="acquisitionDate">Acquisition date</label><input id="acquisitionDate"></div>
        <div class="field"><label for="inServiceDate">In-service date</label><input id="inServiceDate"></div>
        <div class="field"><label for="priorDepr">Prior depreciation taken</label><input id="priorDepr"></div>
        <div class="field wide"><label for="workpaperNotes">Notes</label><textarea id="workpaperNotes"></textarea></div>
      </div>
    </div>

    <div class="section">
      <h3>Site visit</h3>
      <div class="grid">
        <div class="field"><label for="siteVisitType">Site visit type</label><input id="siteVisitType"></div>
        <div class="field"><label for="inspector">Inspector</label><input id="inspector"></div>
        <div class="field"><label for="visitDate">Visit date</label><input id="visitDate" type="date"></div>
      </div>
    </div>
  </template>

  <!-- ===================== BASES ===================== -->
  <template id="bases-panel">
    <div class="bases-top">
      <div class="total" id="basesTotal"></div>
      <button class="btn primary" id="addBasis">＋ Add basis</button>
    </div>
    <div id="basesList"></div>
    <div class="note">
      <b>Bonus %</b> is set by the tax law in effect for the date the property was acquired (binding contract date),
      applied to the year it was placed in service: IRC §168(k) as amended by the PATH Act (2015), the Tax Cuts and Jobs Act (2017),
      and the One Big Beautiful Bill Act (2025, IRS Notice 2026-11). Bonus applies only to the 5, 7 and 15-year property found in the study,
      not to the 27.5/39-year building or land. Not modeled: the extra year for long-production-period property and the 2025 transitional
      40% election. Use the override when a different rate applies.
    </div>
  </template>

  <!-- ===================== EXTERIOR ===================== -->
  <template id="exterior-panel">
    <label class="dropzone" id="exDrop">
      <input type="file" id="exFile" accept="application/pdf" multiple hidden>
      <b>Drag and drop a site plan PDF here</b> or click to browse
      <small>Then set the scale from the plan's scale bar and start measuring</small>
    </label>
    <div class="docs" id="exDocList"></div>

    <div class="ex-wrap hidden" id="exWrap">
      <aside class="ex-panel">
        <h4>Tools</h4>
        <div class="tools" id="exTools">
          <button class="tool" data-tool="area" title="Area: click the corners, then click the first point or press Enter to close"><span class="ic">▱</span>Area<kbd>A</kbd></button>
          <button class="tool" data-tool="linear" title="Linear: click along the line, double-click or Enter to finish"><span class="ic">⟋</span>Linear<kbd>L</kbd></button>
          <button class="tool" data-tool="count" title="Count: click each one"><span class="ic">●</span>Count<kbd>C</kbd></button>
          <button class="tool" data-tool="wall" title="Wall: trace the wall's length, then enter its height (sq ft = length × height)"><span class="ic">▥</span>Wall<kbd>W</kbd></button>
          <button class="tool" data-tool="scale" title="Scale: click both ends of the plan's scale bar"><span class="ic">⇹</span>Scale<kbd>S</kbd></button>
        </div>

        <h4>Items <span style="text-transform:none;letter-spacing:0">· press 1–9 to switch</span></h4>
        <div id="exItems"></div>

        <div class="ex-add">
          <input id="exSearch" placeholder="＋ Add item: search asphalt, curb, light pole…" autocomplete="off">
          <div class="results hidden" id="exResults"></div>
          <button class="linkbtn" id="exCustomBtn" type="button">or add a custom item</button>
          <div id="exCustom" class="hidden">
            <input id="exCName" placeholder="Item name">
            <div class="row2">
              <select id="exCTool"><option value="area">Area (sq ft)</option><option value="linear">Linear (ft)</option><option value="count">Count (each)</option><option value="wall">Wall (sq ft)</option></select>
              <input id="exCCost" class="money" inputmode="decimal" placeholder="$ per unit">
            </div>
            <div class="row2"><button class="btn" type="button" id="exCCancel">Cancel</button><button class="btn primary" type="button" id="exCAdd">Add</button></div>
          </div>
        </div>
      </aside>

      <div class="ex-viewer">
        <div class="ex-bar">
          <button class="small" id="exPrev">◀</button><span id="exPageLbl"></span><button class="small" id="exNext">▶</button>
          <span class="sep"></span>
          <span id="exScaleLbl"></span>
          <span class="sep"></span>
          <button class="small" id="exZoomOut">−</button><span id="exZoomLbl">100%</span><button class="small" id="exZoomIn">＋</button><button class="small" id="exFit">Fit</button>
          <span class="ex-hint" id="exHint"></span>
        </div>
        <div class="ex-stage" id="exStage"></div>
      </div>
    </div>

    <div class="section"><h3>Measurements</h3><div id="exTally"></div>
      <div class="note">Measured items are added to <b>Takeoffs</b> as 15-year property, under the basis you pick here. Change the life on either tab.</div>
    </div>
  </template>

  <!-- ===================== TAKEOFFS ===================== -->
  <template id="takeoffs-panel">
    <div class="section">
      <h3>Add a line item</h3>
      <div class="srcseg" id="toSource">
        <button type="button" data-src="rs" class="on">Estimated (RS Means)</button>
        <button type="button" data-src="actual">Actual cost</button>
      </div>

      <div id="toRsFields" style="margin-top:14px">
        <div class="field search-wrap">
          <label for="toSearch">Search RS Means items (name, CSI code, or description)</label>
          <input id="toSearch" placeholder="Try cabinets, fence, 323123, parking light…" autocomplete="off">
          <div class="results hidden" id="toResults"></div>
        </div>
        <div id="toPicked"></div>
      </div>

      <div id="toActualFields" class="hidden" style="margin-top:14px">
        <div class="grid">
          <div class="field two"><label for="toActName">Item name</label><input id="toActName" placeholder="e.g. Kitchen cabinets per invoice"></div>
          <div class="field"><label for="toActCost">Actual cost ($)</label><input id="toActCost" class="money" inputmode="decimal" placeholder="$"></div>
        </div>
      </div>

      <div class="grid" style="margin-top:14px">
        <div class="field" id="toQtyField"><label for="toQty" id="toQtyLabel">Quantity</label><input id="toQty" class="money" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="toBasis">Basis to subtract from</label><select id="toBasis"></select></div>
        <div class="field"><label for="toCategory">Category</label><select id="toCategory"></select></div>
        <div class="field wide"><label>Life</label>
          <div class="lifeseg" id="toLife"><button type="button" data-life="5">5 yr</button><button type="button" data-life="7">7 yr</button><button type="button" data-life="15">15 yr</button></div>
        </div>
      </div>

      <div class="add-row">
        <div class="preview" id="toPreview"></div>
        <button class="btn primary" id="toAdd">＋ Add item</button>
      </div>
    </div>

    <div class="section"><h3>Totals by basis, life, and category</h3><div id="tallyTree"></div></div>
    <div class="section"><h3>Line items</h3><div id="toItems"></div></div>
  </template>

  <script src="vendor/rsmeans-catalog.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script>
    const tabs = [
      ["Workpapers", "Upload the documents that support the study's values in an audit, and highlight where each value appears."],
      ["Overview", "Property summary and study details."],
      ["Bases", "Each basis being studied: the purchase, improvements, and any others. Fills in from Workpapers."],
      ["Takeoffs", "Line items reclassified out of each basis, estimated from RS Means or from actual costs."],
      ["Exterior", "Measure site work on the plan: areas, lengths, counts, and walls. Results flow into Takeoffs as 15-year property."],
      ["Electrical", "Electrical systems and dedicated circuits."],
      ["Depr Adj", "Depreciation adjustments and catch-up."],
      ["Unit Cost Detail", "Unit costs with location adjustments."],
      ["Indirect Costs", "Soft costs allocated across components."],
      ["Depreciation Report", "MACRS schedules by asset class."],
      ["Review & Deliver", "Final checks and client deliverables."]
    ];

    // ---------- Tabs ----------
    const nav = document.getElementById("tabs");
    const main = document.getElementById("panels");
    const templates = { "Workpapers": "workpapers-panel", "Overview": "overview-form", "Bases": "bases-panel", "Takeoffs": "takeoffs-panel", "Exterior": "exterior-panel" };

    tabs.forEach(([name, desc], i) => {
      const btn = document.createElement("button");
      btn.innerHTML = `<span class="num">${i + 1}</span><span class="lbl">${name}</span><span class="st"></span>`;
      btn.onclick = () => show(i);
      nav.appendChild(btn);

      const panel = document.createElement("section");
      panel.className = "panel";
      panel.innerHTML = `<h2>${name}</h2><p>${desc}</p>`;
      if (templates[name]) {
        panel.appendChild(document.getElementById(templates[name]).content.cloneNode(true));
      } else {
        panel.insertAdjacentHTML("beforeend", `<div class="card"><b>Coming soon</b>This step isn't built yet.</div>`);
      }
      main.appendChild(panel);
    });

    function show(i) {
      nav.querySelectorAll("button").forEach((b, j) => b.classList.toggle("active", i === j));
      main.querySelectorAll(".panel").forEach((p, j) => p.classList.toggle("active", i === j));
      window.scrollTo(0, 0);
    }

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function toast(msg) {
      const t = document.createElement("div");
      t.className = "toast"; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }
    // "$1,234.50" -> 1234.5 ; "" -> null
    function num(v) {
      if (v === null || v === undefined) return null;
      const s = String(v).replace(/[^0-9.\-]/g, "");
      if (!s || s === "-" || s === ".") return null;
      const n = parseFloat(s);
      return isFinite(n) ? n : null;
    }
    const money = n => n === null || n === undefined ? "—" : "$" + Math.round(n).toLocaleString();
    // Accepts 03/15/2026, 3-15-26, 2026-03-15, March 15, 2026 -> "2026-03-15"
    function toISODate(v) {
      if (!v) return "";
      const s = String(v).trim();
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
      m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
      if (m) {
        let y = +m[3]; if (y < 100) y += y < 70 ? 2000 : 1900;
        return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
      }
      const d = new Date(s);
      return isNaN(d) ? "" : d.toISOString().slice(0, 10);
    }

    // Add thousands commas as you type, keeping the cursor in place
    function commafy(v) {
      const s = String(v ?? "");
      if (!/^[\s$]*-?[\d,]*\.?\d*\s*$/.test(s) || !/\d/.test(s)) return s;
      const neg = s.includes("-"), clean = s.replace(/[^\d.]/g, "");
      const [int, dec] = clean.split(".");
      const withCommas = (int || "0").replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return (neg ? "-" : "") + withCommas + (dec !== undefined ? "." + dec : "");
    }
    document.addEventListener("input", e => {
      const el = e.target;
      if (!el.classList || !el.classList.contains("money")) return;
      const pos = el.selectionStart, before = el.value.slice(0, pos).replace(/[^\d.]/g, "").length;
      const next = commafy(el.value);
      if (next === el.value) return;
      el.value = next;
      let i = 0, seen = 0;
      while (i < next.length && seen < before) { if (/[\d.]/.test(next[i])) seen++; i++; }
      el.setSelectionRange(i, i);
    });

    // ---------- Overview: property type, asset class, building life ----------
    const ASSET_CLASSES = {
      "Residential": ["Single Family", "Condo Rental", "Multi-plex Rental", "Townhome", "Cabin"],
      "Multifamily": ["Garden Apartments", "Walk-up Apartments", "Apartment Complex", "Apartment High-rise",
                      "Mixed Use - Apartments/Retail", "Assisted Living", "Mobile Home Park"],
      "Industrial":  ["Flex Warehouse", "Bulk Warehouse", "Light Assembly", "Manufacturing"],
      "Office":      ["Office Condo", "Inline Office Suite", "Low-rise Office Building", "Mid-rise Building",
                      "Office High-rise", "Office Park", "Mixed Use - Office/Retail", "Medical Office", "Medical Office Condo"],
      "Retail":      ["Retail Outparcel", "Inline Retail Unit", "Strip Mall", "Shopping Center", "Power Center"],
      "Restaurant":  ["Inline Restaurant", "Outparcel Restaurant"],
      "Special Purpose": ["Car Wash", "Gas Station", "Auto Garage", "RV Park", "Self-Storage", "Recreation Center"],
      "Hospitality": ["Hotel", "Hotel (Full Service)", "Motel"]
    };

    const propertyType = $("propertyType");
    const customPropertyType = $("customPropertyType");
    const assetClass = $("assetClass");
    const customAssetClass = $("customAssetClass");

    propertyType.addEventListener("change", () => {
      const type = propertyType.value;
      const isCustom = type === "Custom";
      customPropertyType.classList.toggle("hidden", !isCustom);
      if (isCustom) customPropertyType.focus();

      const options = ASSET_CLASSES[type] || [];
      const freeText = type !== "" && options.length === 0;
      assetClass.classList.toggle("hidden", freeText);
      customAssetClass.classList.toggle("hidden", !freeText);
      customAssetClass.value = "";

      const isResidential = type === "Residential";
      $("strRow").classList.toggle("hidden", !isResidential);
      if (!isResidential) $("shortTermRental").checked = false;

      setBuildingLife();

      assetClass.innerHTML = type === ""
        ? `<option value="">Select a property type first</option>`
        : `<option value="">Select…</option>` + options.map(o => `<option>${o}</option>`).join("");
    });

    // Building life: Residential and Multifamily = 27.5, everything else = 39.
    // A short-term rental is treated as nonresidential, so it gets 39.
    function setBuildingLife() {
      const type = propertyType.value;
      const str = $("shortTermRental").checked;
      const life = type === "" ? "" : ((type === "Residential" || type === "Multifamily") && !str ? "27.5" : "39");
      $("buildingLife").value = life;
    }
    $("shortTermRental").addEventListener("change", setBuildingLife);

    // ---------- Workpapers ----------
    const SUPPORT_DOCS = ["Settlement Statement", "Closing Disclosure", "Purchase Agreement", "Appraisal",
      "Construction Cost Detail", "General Ledger", "Depreciation Schedule", "Documents Prepared by Client"];

    // relates: the item can belong to the purchase or an improvement
    const ITEMS = [
      { key: "owner",     label: "Owner Name",       color: "#2563eb", target: "taxpayerEntity" },
      { key: "address",   label: "Address",          color: "#16a34a", target: "address" },
      { key: "parcel",    label: "Parcel Number",    color: "#9333ea", target: "parcelNumber" },
      { key: "sqft",      label: "Total Sq Ft",      color: "#ea580c", target: "totalSqft" },
      { key: "lot",       label: "Lot Size",         color: "#0d9488", target: "lotSize" },
      { key: "yearBuilt", label: "Year Built",       color: "#db2777", target: "yearBuilt" },
      { key: "price",     label: "Purchase Price",   color: "#dc2626", target: "purchasePrice" },
      { key: "impCost",   label: "Improvement Cost", color: "#4f46e5", improvementOnly: true },
      { key: "land",      label: "Land Value",       color: "#65a30d", target: "landValue" },
      { key: "acq",       label: "Acquisition Date", color: "#ca8a04", target: "acquisitionDate", relates: true },
      { key: "inService", label: "In-Service Date",  color: "#0891b2", target: "inServiceDate", relates: true },
      { key: "priorDepr", label: "Prior Depr Taken", color: "#92400e", target: "priorDepr", relates: true },
      { key: "note",      label: "Note",             color: "#64748b", target: "workpaperNotes", multi: true }
    ];
    const itemByKey = Object.fromEntries(ITEMS.map(it => [it.key, it]));

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDF_WORKER_URL || "vendor/pdf.worker.min.js";
    }

    const docs = [];        // { id, name, pdf, numPages, lastSupport }
    // finding: { id, docId, page, key, value, rect, support, relatesTo: "purchase" | "imp:N", landMode: "$" | "%", subtractLand }
    let findings = [];
    let currentDoc = null;
    let activeKey = null;
    let openPopup = null;
    let nextId = 1;
    const lastAuto = {};    // what we last auto-filled into each Overview field

    // Improvement numbers that exist in the findings
    function improvementNums() {
      const set = new Set();
      findings.forEach(f => { if (f.relatesTo && f.relatesTo.startsWith("imp:")) set.add(+f.relatesTo.slice(4)); });
      return [...set].sort((a, b) => a - b);
    }
    const impName = n => (bases.find(b => b.link === "imp:" + n)?.name) || `Improvement ${n}`;
    const relatesLabel = r => r === "purchase" ? "Purchase" : impName(+r.slice(4));

    // Item chips
    const chips = $("chips");
    chips.innerHTML = ITEMS.map(it =>
      `<button class="chip" data-key="${it.key}" style="--c:${it.color}">${it.label}<span class="count"></span></button>`
    ).join("");
    chips.addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      setActive(activeKey === chip.dataset.key ? null : chip.dataset.key);
    });

    function setActive(key) {
      activeKey = key;
      chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.key === key));
      document.querySelectorAll(".page-layer").forEach(l => l.classList.toggle("drawing", !!key));
    }
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closePopup(); setActive(null); }
    });

    // Upload: drag and drop or browse
    const dropzone = $("dropzone");
    const fileInput = $("fileInput");
    fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });
    ["dragenter", "dragover"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove("over"); }));
    dropzone.addEventListener("drop", e => addFiles(e.dataTransfer.files));
    window.addEventListener("dragover", e => e.preventDefault());
    window.addEventListener("drop", e => e.preventDefault());

    async function addFiles(fileList) {
      if (!window.pdfjsLib) { toast("PDF viewer didn't load. Refresh and try again."); return; }
      const pdfs = [...fileList].filter(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
      if (!pdfs.length) { toast("Only PDF files can be uploaded."); return; }
      for (const file of pdfs) {
        try {
          const data = new Uint8Array(await file.arrayBuffer());
          const pdf = await pdfjsLib.getDocument({ data }).promise;
          const doc = { id: nextId++, name: file.name, pdf, numPages: pdf.numPages, lastSupport: "" };
          docs.push(doc);
          currentDoc = doc;
        } catch (err) {
          console.error(err);
          toast(`Couldn't open ${file.name}.`);
        }
      }
      renderDocList();
      renderPages();
    }

    function renderDocList() {
      $("palette").classList.toggle("hidden", docs.length === 0);
      $("docList").innerHTML = docs.map(d => {
        const n = findings.filter(f => f.docId === d.id).length;
        return `<span class="doc-pill ${d === currentDoc ? "active" : ""}" data-id="${d.id}">
                  <button class="open">📄 ${esc(d.name)}<span>${d.numPages} pg${n ? ` · ${n} found` : ""}</span></button>
                  <button class="del" title="Delete this workpaper">×</button></span>`;
      }).join("");
      $("docList").querySelectorAll(".doc-pill").forEach(pill => {
        const doc = docs.find(d => d.id === +pill.dataset.id);
        pill.querySelector(".open").onclick = () => { currentDoc = doc; renderDocList(); renderPages(); };
        pill.querySelector(".del").onclick = () => deleteDoc(doc);
      });
    }

    // Remove a workpaper and everything highlighted on it
    function deleteDoc(doc) {
      const n = findings.filter(f => f.docId === doc.id).length;
      const msg = n
        ? `Delete "${doc.name}"? Its ${n} highlighted item${n > 1 ? "s" : ""} will be removed too.`
        : `Delete "${doc.name}"?`;
      if (!confirm(msg)) return;
      findings = findings.filter(f => f.docId !== doc.id);
      docs.splice(docs.indexOf(doc), 1);
      doc.pdf.destroy();
      if (currentDoc === doc) { currentDoc = docs[docs.length - 1] || null; setActive(null); }
      afterFindingsChange();
      renderPages();
    }

    let renderToken = 0;
    async function renderPages() {
      closePopup();
      const token = ++renderToken;
      const pages = $("pages");
      pages.innerHTML = "";
      if (!currentDoc) return;

      const width = Math.min(860, Math.max(420, pages.clientWidth - 250));
      for (let n = 1; n <= currentDoc.numPages; n++) {
        const page = await currentDoc.pdf.getPage(n);
        if (token !== renderToken) return;   // user switched documents
        const base = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: width / base.width });
        const ratio = window.devicePixelRatio || 1;

        const row = document.createElement("div");
        row.className = "page-row";
        row.innerHTML = `
          <aside class="page-side" data-page="${n}"></aside>
          <div class="page-wrap" style="width:${viewport.width}px;height:${viewport.height}px">
            <div class="page-num">Page ${n} of ${currentDoc.numPages}</div>
            <canvas></canvas>
            <div class="page-layer ${activeKey ? "drawing" : ""}" data-page="${n}"></div>
          </div>`;
        pages.appendChild(row);

        const canvas = row.querySelector("canvas");
        canvas.width = viewport.width * ratio;
        canvas.height = viewport.height * ratio;
        canvas.style.width = viewport.width + "px";
        canvas.style.height = viewport.height + "px";
        const ctx = canvas.getContext("2d");
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        await page.render({ canvasContext: ctx, viewport }).promise;

        const layer = row.querySelector(".page-layer");
        layer._page = page;
        layer._viewport = viewport;
        wireDrawing(layer, n);
        drawPage(n);
      }
    }

    // Draw a box on the page with the mouse
    function wireDrawing(layer, pageNum) {
      layer.addEventListener("pointerdown", e => {
        if (e.button !== 0 || e.target.closest(".popup")) return;
        if (!activeKey) { toast("Pick an item above first, then drag over it on the page."); return; }
        closePopup();
        const box = layer.getBoundingClientRect();
        const x0 = e.clientX - box.left, y0 = e.clientY - box.top;
        const item = itemByKey[activeKey];
        const draft = document.createElement("div");
        draft.className = "hl draft";
        draft.style.setProperty("--c", item.color);
        layer.appendChild(draft);
        layer.setPointerCapture(e.pointerId);

        const move = ev => {
          const x1 = Math.min(Math.max(ev.clientX - box.left, 0), box.width);
          const y1 = Math.min(Math.max(ev.clientY - box.top, 0), box.height);
          Object.assign(draft.style, {
            left: Math.min(x0, x1) + "px", top: Math.min(y0, y1) + "px",
            width: Math.abs(x1 - x0) + "px", height: Math.abs(y1 - y0) + "px"
          });
        };
        const up = async () => {
          layer.removeEventListener("pointermove", move);
          layer.removeEventListener("pointerup", up);
          const w = draft.offsetWidth, h = draft.offsetHeight;
          if (w < 6 || h < 6) { draft.remove(); return; }
          const rect = { x: draft.offsetLeft / box.width, y: draft.offsetTop / box.height, w: w / box.width, h: h / box.height };
          const text = await textInBox(layer, rect);
          askValue(layer, pageNum, item, rect, { value: text }, draft, null);
        };
        layer.addEventListener("pointermove", move);
        layer.addEventListener("pointerup", up);
      });
    }

    // Read the PDF text that sits inside the box, so the popup can pre-fill it
    async function textInBox(layer, rect) {
      try {
        const vp = layer._viewport;
        const content = await layer._page.getTextContent();
        const L = rect.x * vp.width, T = rect.y * vp.height, R = L + rect.w * vp.width, B = T + rect.h * vp.height;
        const hits = [];
        for (const it of content.items) {
          if (!it.str || !it.str.trim()) continue;
          const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
          const h = Math.hypot(tx[2], tx[3]);
          const w = it.width * vp.scale;
          const x0 = tx[4], x1 = tx[4] + w, cy = tx[5] - h / 2;
          if (cy < T || cy > B || x1 < L || x0 > R || w <= 0) continue;
          // A text run is often a whole line; keep only the characters inside the box
          const n = it.str.length;
          const a = Math.max(0, Math.round(((L - x0) / w) * n));
          const b = Math.min(n, Math.round(((R - x0) / w) * n));
          const part = it.str.slice(a, b);
          if (part.trim()) hits.push({ s: part, x: x0, y: tx[5] });
        }
        hits.sort((a, b) => Math.abs(a.y - b.y) > 3 ? a.y - b.y : a.x - b.x);
        return hits.map(h => h.s).join(" ").replace(/\s+/g, " ").trim();
      } catch { return ""; }
    }

    // Popup: type what was highlighted, pick the supporting document, and item-specific options
    function askValue(layer, pageNum, item, rect, init, draft, existing) {
      closePopup();
      const doc = currentDoc;
      const pop = document.createElement("div");
      pop.className = "popup";
      pop.style.setProperty("--c", item.color);

      // "Relates to" choices: purchase, each improvement found so far, and a new improvement
      const imps = improvementNums();
      const nextImp = (imps[imps.length - 1] || 0) + 1;
      const relOpts = [
        ...(item.improvementOnly ? [] : [["purchase", "Overall purchase"]]),
        ...imps.map(n => ["imp:" + n, impName(n)]),
        ["imp:" + nextImp, `New improvement (${impName(nextImp)})`]
      ];
      const relDefault = init.relatesTo || (item.improvementOnly ? "imp:" + nextImp : "purchase");
      const supportDefault = init.support || doc.lastSupport || "";
      const landMode = init.landMode || "$";
      const subtract = init.subtractLand !== undefined ? init.subtractLand : true;

      const valueField = item.multi
        ? `<textarea class="v">${esc(init.value)}</textarea>`
        : item.key === "land"
          ? `<div class="with-seg"><input class="v" value="${esc(init.value)}">
               <span class="seg"><button type="button" data-mode="$" class="${landMode === "$" ? "on" : ""}">$</button><button type="button" data-mode="%" class="${landMode === "%" ? "on" : ""}">%</button></span></div>`
          : `<input class="v" value="${esc(init.value)}">`;

      pop.innerHTML = `
        <div class="title">${item.label}</div>
        <div class="row"><label>${item.key === "land" ? "Land value ($ amount or % of purchase price)" : "Value"}</label>${valueField}</div>
        ${item.key === "land" ? `<div class="row"><label class="check"><input type="checkbox" class="sub" ${subtract ? "checked" : ""}> Subtract land value from purchase price</label></div>` : ""}
        ${item.relates || item.improvementOnly ? `<div class="row"><label>${item.improvementOnly ? "Which improvement" : "Relates to"}</label>
          <select class="rel">${relOpts.map(([v, l]) => `<option value="${v}" ${v === relDefault ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>` : ""}
        <div class="row"><label>Supporting document</label>
          <select class="sup"><option value="">Select…</option>${SUPPORT_DOCS.map(d => `<option ${d === supportDefault ? "selected" : ""}>${d}</option>`).join("")}</select></div>
        <div class="err hidden"></div>
        <div class="btns"><button class="cancel">Cancel</button><button class="save">Save</button></div>`;

      layer.appendChild(pop);
      pop.addEventListener("pointerdown", e => e.stopPropagation());

      // Place below the box, or above it if there isn't room
      const vw = layer.clientWidth, vh = layer.clientHeight, ph = pop.offsetHeight;
      let left = Math.min(rect.x * vw, vw - pop.offsetWidth - 4);
      let top = (rect.y + rect.h) * vh + 6;
      if (top + ph > vh) top = Math.max(0, rect.y * vh - ph - 6);
      pop.style.left = Math.max(0, left) + "px";
      pop.style.top = top + "px";

      let mode = landMode;
      pop.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
        mode = b.dataset.mode;
        pop.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
      });

      const input = pop.querySelector(".v");
      input.focus(); input.select();
      const err = pop.querySelector(".err");
      const fail = msg => { err.textContent = msg; err.classList.remove("hidden"); };

      const cancel = () => { if (draft) draft.remove(); closePopup(); };
      const save = () => {
        const value = input.value.trim();
        const support = pop.querySelector(".sup").value;
        if (!value) { input.focus(); return fail("Type what you highlighted."); }
        if (!support) { pop.querySelector(".sup").focus(); return fail("Pick the supporting document."); }
        const data = { value, support };
        if (item.relates || item.improvementOnly) data.relatesTo = pop.querySelector(".rel").value;
        if (item.key === "land") { data.landMode = mode; data.subtractLand = pop.querySelector(".sub").checked; }
        doc.lastSupport = support;

        if (existing) Object.assign(existing, data);
        else findings.push({ id: nextId++, docId: doc.id, page: pageNum, key: item.key, rect, ...data });
        if (draft) draft.remove();
        closePopup();
        if (!existing) setActive(null);
        drawPage(pageNum);
        afterFindingsChange();
      };
      pop.querySelector(".cancel").onclick = cancel;
      pop.querySelector(".save").onclick = save;
      pop.addEventListener("keydown", e => {
        if (e.key === "Enter" && !(item.multi && e.shiftKey) && e.target.tagName !== "SELECT") { e.preventDefault(); save(); }
        if (e.key === "Escape") { e.stopPropagation(); cancel(); }
      });
      openPopup = { el: pop, cancel };
    }
    function closePopup() {
      if (openPopup) { const p = openPopup; openPopup = null; p.el.remove(); }
      document.querySelectorAll(".hl.draft").forEach(d => d.remove());
    }

    function displayValue(f) {
      if (f.key === "land") return (f.landMode === "%" ? `${num(f.value) ?? f.value}% of purchase price` : f.value);
      return f.value;
    }

    // Draw saved highlights and the left-side list for one page
    function drawPage(pageNum) {
      const layer = document.querySelector(`.page-layer[data-page="${pageNum}"]`);
      const side = document.querySelector(`.page-side[data-page="${pageNum}"]`);
      if (!layer || !side || !currentDoc) return;
      layer.querySelectorAll(".hl:not(.draft)").forEach(h => h.remove());
      const onPage = findings.filter(f => f.docId === currentDoc.id && f.page === pageNum);

      for (const f of onPage) {
        const it = itemByKey[f.key];
        const hl = document.createElement("div");
        hl.className = "hl";
        hl.title = `${it.label}: ${displayValue(f)}`;
        hl.style.setProperty("--c", it.color);
        Object.assign(hl.style, { left: f.rect.x * 100 + "%", top: f.rect.y * 100 + "%", width: f.rect.w * 100 + "%", height: f.rect.h * 100 + "%" });
        layer.prepend(hl);
      }

      side.innerHTML = `<h4>Page ${pageNum}</h4>` + (onPage.length
        ? onPage.map(f => {
            const it = itemByKey[f.key];
            const rel = f.relatesTo && f.relatesTo !== "purchase" ? ` · ${esc(relatesLabel(f.relatesTo))}` : "";
            const sub = f.key === "land" ? (f.subtractLand ? " · subtracted" : " · not subtracted") : "";
            return `<div class="finding" style="--c:${it.color}" data-id="${f.id}" title="Click to edit">
                      <div class="name">${it.label}${rel}</div><div class="val">${esc(displayValue(f))}</div>
                      <div class="meta">${esc(f.support)}${sub}</div>
                      <button title="Remove">×</button></div>`;
          }).join("")
        : `<div class="none">Nothing found on this page yet.</div>`);

      side.querySelectorAll(".finding").forEach(el => {
        const f = findings.find(x => x.id === +el.dataset.id);
        el.querySelector("button").onclick = e => {
          e.stopPropagation();
          findings = findings.filter(x => x !== f);
          drawPage(pageNum);
          afterFindingsChange();
        };
        el.style.cursor = "pointer";
        el.onclick = () => askValue(layer, pageNum, itemByKey[f.key], f.rect, f, null, f);
      });
    }

    function redrawAllPages() {
      if (!currentDoc) return;
      for (let n = 1; n <= currentDoc.numPages; n++) drawPage(n);
    }

    // Show a check and count on each item once it's been found
    function refreshCounts() {
      chips.querySelectorAll(".chip").forEach(c => {
        const n = findings.filter(f => f.key === c.dataset.key).length;
        c.classList.toggle("found", n > 0);
        c.querySelector(".count").textContent = n ? `✓ ${n}` : "";
      });
    }

    function afterFindingsChange() {
      refreshCounts();
      syncOverview();
      syncBases();
      renderDocList();
    }

    // Latest finding for an item (optionally for one purchase/improvement)
    function latest(key, relatesTo) {
      const list = findings.filter(f => f.key === key && (relatesTo === undefined || (f.relatesTo || "purchase") === relatesTo));
      return list[list.length - 1] || null;
    }

    // Copy found purchase values into the Overview tab
    function syncOverview() {
      for (const it of ITEMS) {
        if (!it.target) continue;
        const el = $(it.target);
        let value = "";
        if (it.multi) value = findings.filter(f => f.key === it.key).map(f => f.value).join("\n");
        else {
          const f = latest(it.key, it.relates ? "purchase" : undefined);
          if (f) value = displayValue(f);
        }
        if (value) {
          el.value = value;
          lastAuto[it.target] = value;
        } else if (lastAuto[it.target] !== undefined && el.value === lastAuto[it.target]) {
          el.value = "";
          delete lastAuto[it.target];
        }
        el.classList.toggle("auto", !!value);
        el.style.borderLeftColor = value ? it.color : "";
      }
    }

    // ---------- Bases ----------
    const KINDS = ["Acquisition (building + land)", "New Construction", "Improvement", "Step Up"];
    // basis: { id, link: "purchase" | "imp:N" | null, name, kind, amount, landMode, land, landSource,
    //          subtractLand, acqDate, pisDate, fedDepr, bonusOverride, manual: Set of fields typed by hand }
    let bases = [];

    function newBasis(link, n) {
      return {
        id: nextId++, link,
        name: link === "purchase" ? "Building" : link ? `Improvement ${n}` : `Basis ${bases.length + 1}`,
        kind: link === "purchase" ? KINDS[0] : link ? "Improvement" : KINDS[0],
        amount: "", landMode: "$", land: "", landSource: "", subtractLand: link === "purchase" || !link,
        acqDate: "", pisDate: "", fedDepr: "", bonusOverride: "", manual: new Set()
      };
    }

    const sourceOf = f => {
      const d = docs.find(x => x.id === f.docId);
      return `${f.support}${d ? ` (${d.name}, p. ${f.page})` : ""}`;
    };

    // Pull values from Workpapers into the linked bases (never over something typed by hand)
    function syncBases() {
      const links = [];
      if (findings.some(f => ["price", "land", "acq", "inService", "priorDepr"].includes(f.key) && (f.relatesTo || "purchase") === "purchase")) links.push("purchase");
      improvementNums().forEach(n => links.push("imp:" + n));

      for (const link of links) {
        let b = bases.find(x => x.link === link);
        if (!b) {
          b = newBasis(link, link === "purchase" ? 0 : +link.slice(4));
          if (link === "purchase") bases.unshift(b); else bases.push(b);
        }
        const isP = link === "purchase";
        const auto = {
          amount: latest(isP ? "price" : "impCost", isP ? undefined : link),
          acqDate: latest("acq", link),
          pisDate: latest("inService", link),
          fedDepr: latest("priorDepr", link)
        };
        const set = (field, v) => { if (!b.manual.has(field)) b[field] = v; };
        set("amount", auto.amount ? String(num(auto.amount.value) ?? auto.amount.value) : "");
        set("acqDate", auto.acqDate ? toISODate(auto.acqDate.value) : "");
        set("pisDate", auto.pisDate ? toISODate(auto.pisDate.value) : "");
        set("fedDepr", auto.fedDepr ? String(num(auto.fedDepr.value) ?? auto.fedDepr.value) : "");
        b._auto = { amount: !!auto.amount, acqDate: !!auto.acqDate, pisDate: !!auto.pisDate, fedDepr: !!auto.fedDepr };
        if (isP) {
          const land = latest("land");
          if (!b.manual.has("land")) {
            b.land = land ? String(num(land.value) ?? land.value) : "";
            b.landMode = land ? land.landMode : "$";
          }
          set("landSource", land ? sourceOf(land) : "");
          set("subtractLand", land ? land.subtractLand : true);
          b._auto.land = b._auto.landSource = !!land;
        }
      }
      // Drop linked bases whose findings are all gone, unless something was typed by hand
      bases = bases.filter(b => !b.link || links.includes(b.link) || b.manual.size > 0);
      renderBases();
      redrawAllPages();
    }

    // Bonus % from the law in effect when the property was acquired, for the year placed in service
    function bonusFor(b) {
      if (b.kind === "Step Up")
        return { pct: 0, why: "<b>Stepped-up (inherited) basis</b> isn't acquired by purchase, so it doesn't qualify for bonus." };
      if (!b.pisDate) return { pct: null, why: "Enter the in-service date to figure the bonus %." };
      if (!b.acqDate) return { pct: null, why: b.kind === "New Construction"
        ? "Enter the acquisition date (for new construction, the date construction began)."
        : "Enter the acquisition (binding contract) date to figure the bonus %." };
      const acq = b.acqDate, pis = b.pisDate, y = +pis.slice(0, 4);
      if (pis < acq) return { pct: null, why: "The in-service date is before the acquisition date. Check the dates." };

      if (acq >= "2025-01-20")
        return { pct: 100, why: "<b>One Big Beautiful Bill Act:</b> acquired after Jan. 19, 2025, so it gets the permanent 100% bonus." };

      if (acq >= "2017-09-28") {
        const pct = y <= 2022 ? 100 : y === 2023 ? 80 : y === 2024 ? 60 : y === 2025 ? 40 : y === 2026 ? 20 : 0;
        return { pct, why: `<b>Tax Cuts and Jobs Act:</b> acquired after Sept. 27, 2017 and before Jan. 20, 2025, so the phase-down applies for the year placed in service (${y}): ${pct}%.` };
      }

      // Acquired before Sept. 28, 2017
      if (b.kind === KINDS[0])
        return { pct: 0, why: "<b>Pre-TCJA:</b> used property bought before Sept. 28, 2017 doesn't qualify. Bonus then required original use." };
      if (y < 2008) return { pct: null, why: "Placed in service before 2008. Check the rate by hand and use the override." };
      let pct;
      if (y <= 2009) pct = 50;
      else if (y === 2010) pct = (acq >= "2010-09-09" && pis >= "2010-09-09") ? 100 : 50;
      else if (y === 2011) pct = acq >= "2010-09-09" ? 100 : 50;
      else if (y <= 2017) pct = 50;
      else if (y === 2018) pct = 40;
      else if (y === 2019) pct = 30;
      else pct = 0;
      return { pct, why: `<b>Pre-TCJA rules (PATH Act and earlier):</b> acquired before Sept. 28, 2017 and placed in service in ${y}: ${pct}%.` };
    }

    function landAmount(b) {
      const amt = num(b.amount), land = num(b.land);
      if (land === null) return null;
      return b.landMode === "%" ? (amt === null ? null : amt * land / 100) : land;
    }
    function depreciable(b) {
      const amt = num(b.amount);
      if (amt === null) return null;
      const land = b.subtractLand ? (landAmount(b) || 0) : 0;
      return amt - land;
    }

    function renderBases() {
      const list = $("basesList");
      const total = bases.reduce((s, b) => s + (depreciable(b) || 0), 0);
      $("basesTotal").innerHTML = bases.length
        ? `${bases.length} bas${bases.length > 1 ? "es" : "is"} · Total depreciable basis <b>${money(total)}</b>`
        : "No bases yet. Highlight a purchase price or improvement cost on Workpapers, or add one here.";

      list.innerHTML = bases.map(b => {
        const bonus = bonusFor(b);
        const ovr = num(b.bonusOverride);
        const shown = ovr !== null ? ovr : bonus.pct;
        const wp = f => b._auto && b._auto[f] && !b.manual.has(f) ? "fromwp" : "";
        const isAcq = b.kind === KINDS[0];
        const la = landAmount(b);
        return `
        <div class="section basis-card" data-id="${b.id}">
          <div class="head">
            <div class="tag">${b.link ? `Linked to <b>Workpapers</b> (${b.link === "purchase" ? "purchase" : "improvement"})` : "Added by hand"}</div>
            ${b.link ? "" : `<button class="btn danger" data-act="remove">Remove</button>`}
          </div>
          <div class="grid four">
            <div class="field"><label>Name</label><input data-f="name" value="${esc(b.name)}"></div>
            <div class="field"><label>Kind</label><select data-f="kind">${KINDS.map(k => `<option ${k === b.kind ? "selected" : ""}>${k}</option>`).join("")}</select></div>
            <div class="field"><label>Amount</label><input data-f="amount" class="money ${wp("amount")}" value="${esc(commafy(b.amount))}" inputmode="decimal" placeholder="$"></div>
            <div class="field"><label>Fed depreciation taken</label><input data-f="fedDepr" class="money ${wp("fedDepr")}" value="${esc(commafy(b.fedDepr))}" inputmode="decimal" placeholder="$"></div>

            <div class="field"><label>Acquisition date</label><input type="date" data-f="acqDate" class="${wp("acqDate")}" value="${esc(b.acqDate)}"></div>
            <div class="field"><label>In-service date</label><input type="date" data-f="pisDate" class="${wp("pisDate")}" value="${esc(b.pisDate)}"></div>

            <div class="field ${isAcq ? "" : "hidden"}"><label>Land value</label>
              <div class="with-seg"><input data-f="land" class="${b.landMode === "$" ? "money" : ""} ${wp("land")}" value="${esc(b.landMode === "$" ? commafy(b.land) : b.land)}" inputmode="decimal">
                <span class="seg"><button type="button" data-mode="$" class="${b.landMode === "$" ? "on" : ""}">$</button><button type="button" data-mode="%" class="${b.landMode === "%" ? "on" : ""}">%</button></span></div>
            </div>
            <div class="field ${isAcq ? "" : "hidden"}"><label>Land source</label><input data-f="landSource" class="${wp("landSource")}" value="${esc(b.landSource)}"></div>
            <div class="field wide ${isAcq ? "" : "hidden"}"><label class="check"><input type="checkbox" data-f="subtractLand" ${b.subtractLand ? "checked" : ""}> Subtract land value from purchase price</label></div>
          </div>

          <div class="summary">
            <div>Amount<b>${money(num(b.amount))}</b></div>
            ${isAcq ? `<div>Land${b.landMode === "%" && num(b.land) !== null ? ` (${num(b.land)}%)` : ""}<b>${b.subtractLand ? (la !== null ? "−" + money(la) : "—") : "not subtracted"}</b></div>` : ""}
            <div>Depreciable basis<b>${money(isAcq ? depreciable(b) : num(b.amount))}</b></div>
          </div>

          <div class="bonus">
            <div class="pct">${shown === null || shown === undefined ? "—" : shown + "%"}</div>
            <div class="why">${ovr !== null ? `<b>Override in use.</b> Calculated rate: ${bonus.pct ?? "—"}%. ` : ""}${bonus.why}</div>
            <label class="ovr">Override <input data-f="bonusOverride" value="${esc(b.bonusOverride)}" inputmode="decimal" placeholder="%"></label>
          </div>
        </div>`;
      }).join("");

      list.querySelectorAll(".basis-card").forEach(card => {
        const b = bases.find(x => x.id === +card.dataset.id);
        card.querySelectorAll("[data-f]").forEach(el => {
          const f = el.dataset.f;
          const ev = el.type === "checkbox" || el.tagName === "SELECT" || el.type === "date" ? "change" : "change";
          el.addEventListener(ev, () => {
            b[f] = el.type === "checkbox" ? el.checked : el.value;
            if (!["name", "kind", "bonusOverride"].includes(f)) b.manual.add(f);
            if (f === "kind" && b.kind !== KINDS[0]) b.subtractLand = false;
            if (f === "kind" && b.kind === KINDS[0] && !b.manual.has("subtractLand")) b.subtractLand = true;
            // Re-draw after focus moves, then put the cursor back where the user went
            setTimeout(() => {
              const a = document.activeElement, c = a && a.closest && a.closest(".basis-card");
              const back = c && a.dataset.f ? [c.dataset.id, a.dataset.f] : null;
              renderBases();
              if (back) document.querySelector(`.basis-card[data-id="${back[0]}"] [data-f="${back[1]}"]`)?.focus();
              if (f === "name") redrawAllPages();
            });
          });
        });
        card.querySelectorAll(".seg button").forEach(btn => btn.onclick = () => {
          b.landMode = btn.dataset.mode; b.manual.add("land"); renderBases();
        });
        card.querySelector('[data-act="remove"]')?.addEventListener("click", () => {
          bases = bases.filter(x => x !== b); renderBases();
        });
      });
      if (typeof renderTakeoffs === "function") renderTakeoffs();
    }

    // (the Takeoffs basis list follows the Bases tab)
    $("addBasis").onclick = () => {
      const b = newBasis(null);
      b.manual.add("name");
      bases.push(b);
      renderBases();
      document.querySelector(`.basis-card[data-id="${b.id}"] input`)?.focus();
    };

    // ---------- Takeoffs ----------
    const CATALOG = (window.RS_CATALOG || []).map(r => ({ csi: r[0], name: r[1], unit: r[2], cost: r[3], desc: r[4], category: r[5], oldName: r[6] }));
    const CATEGORIES = [...new Set(CATALOG.map(c => c.category))].filter(c => c !== "Other").sort().concat("Other");
    const UNIT_LABEL = {
      "L.F.": "Linear ft", "S.F.": "Sq ft", "Ea.": "Each", "Opng.": "Each opening", "Pair": "Pair", "S.Y.": "Sq yd",
      "Riser": "Per riser", "SF Surf": "Sq ft (surface)", "SF Flr.": "Sq ft (floor)", "V.L.F.": "Vertical linear ft",
      "C.L.F.": "100 linear ft", "Speaker": "Per speaker", "Total": "Each system", "Stall": "Per stall", "Court": "Per court",
      "C.Y.": "Cubic yd", "M.S.F.": "1,000 sq ft", "Room": "Per room", "M.L.F.": "1,000 linear ft", "SF Shlf": "Sq ft (shelf)",
      "Lb.": "Pound", "C.F.": "Cubic ft", "C": "Per 100", "SF Hor.": "Sq ft (horizontal)"
    };
    const unitLabel = u => UNIT_LABEL[u] || u;
    const money2 = n => "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    // Site work is usually 15-year land improvements; everything else starts at 5. Always changeable.
    const SITE = new Set(["Land Improvements", "Landscaping", "Fencing & Gates", "Site Lighting", "Parking Equipment"]);
    const suggestLife = cat => SITE.has(cat) ? 15 : 5;

    // item: { id, source: "rs" | "actual", csi, name, unit, unitCost, qty, total, basisId, life, category }
    let takeoffs = [];
    const form = { source: "rs", picked: null, life: null };

    $("toCategory").innerHTML = `<option value="">Select…</option>` + CATEGORIES.map(c => `<option>${esc(c)}</option>`).join("");

    // Source: RS Means estimate or actual cost
    $("toSource").querySelectorAll("button").forEach(b => b.onclick = () => {
      form.source = b.dataset.src;
      $("toSource").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      $("toRsFields").classList.toggle("hidden", form.source !== "rs");
      $("toActualFields").classList.toggle("hidden", form.source !== "actual");
      $("toQtyField").classList.toggle("hidden", form.source !== "rs");
      updatePreview();
      (form.source === "rs" ? $("toSearch") : $("toActName")).focus();
    });

    // Life buttons
    function setLife(life) {
      form.life = life;
      $("toLife").querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.life === life));
      updatePreview();
    }
    $("toLife").querySelectorAll("button").forEach(b => b.onclick = () => setLife(+b.dataset.life));

    // Search: every word must match the name, old name, CSI, category, or description
    const toSearch = $("toSearch"), toResults = $("toResults");
    let hits = [], hi = 0;
    function search(q) {
      const words = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!words.length) return [];
      const scored = [];
      for (const c of CATALOG) {
        const name = c.name.toLowerCase();
        const hay = `${name} ${c.oldName.toLowerCase()} ${c.csi} ${c.category.toLowerCase()} ${c.desc.toLowerCase()}`;
        if (!words.every(w => hay.includes(w))) continue;
        let score = 0;
        words.forEach(w => { if (name.startsWith(w)) score += 4; else if (name.includes(w)) score += 2; if (c.csi.startsWith(w)) score += 3; });
        scored.push([score, c]);
      }
